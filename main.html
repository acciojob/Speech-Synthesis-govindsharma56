<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Speech Synthesis</title>
  <link href='https://fonts.googleapis.com/css?family=Pacifico' rel='stylesheet' type='text/css'>
  <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="voiceinator">

      <h1>The Voiceinator 5000</h1>

      <select id="voices">
          <option>Select a voice</option>
      </select>

      <label for="rate">Rate:</label>
      <input name="rate" type="range" id='rate' min="0" max="3" value="1" step="0.1">

      <label for="pitch">Pitch:</label>

      <input name="pitch" type="range" id="pitch" min="0" max="2" step="0.1">
      <textarea id="text"  name="text">Hello! I love JavaScript 👍</textarea>
      <button id="stop">Stop!</button>
      <button id="speak">Speak</button>

    </div>

<script>
  const msg = new SpeechSynthesisUtterance();
   let voices = [];
  const voicesDropdown = document.querySelector('#voices');
	
	const rate = document.querySelector("#rate");
const pitch = document.querySelector("#pitch");
  const speakButton = document.querySelector('#speak');
  const stopButton = document.querySelector('#stop');
  speechSynthesis.onvoiceschanged = () => {
    voices = speechSynthesis.getVoices();
	  if(voices.length==0){
		  voicesDropdown.innerHTML =
            '<option>No voices available</option>';
		  return;
     }

    voicesDropdown.innerHTML = '<option value="">Select A Voice</option>';

    voices.forEach((voice) => {
        const option = document.createElement("option");

        option.value = voice.name;
        option.textContent = `${voice.name} (${voice.lang})`;

        voicesDropdown.appendChild(option);
    });
};

  //Your code goes here
	let utterance=null;
	let textarea=document.querySelector('#text');
	
	speakButton.addEventListener('click',()=>{
		 if(textarea.value.trim()===""){
		return;
      }
		
		 utterance=new SpeechSynthesisUtterance(textarea.value);
		const selectvoice=voices.find(voice=>voice.name===voicesDropdown.value)
		   utterance.voice=selectvoice;
		utterance.rate = Number(rate.value);
        utterance.pitch = Number(pitch.value);
		speechSynthesis.speak(utterance);
   });
	stopButton.addEventListener('click',()=>{
		speechSynthesis.cancel();
})

</script>

</body>
</html>
