<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Speech Synthesis</title>
  <link href='https://fonts.googleapis.com/css?family=Pacifico' rel='stylesheet' type='text/css'>
  <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="voiceinator">

      <h1>The Voiceinator 5000</h1>

      <select id="voices">
          <option>Select a voice</option>
      </select>

      <label for="rate">Rate:</label>
      <input name="rate" type="range" id='rate' min="0" max="3" value="1" step="0.1">

      <label for="pitch">Pitch:</label>

      <input name="pitch" type="range" id="pitch" min="0" max="2" step="0.1">
      <textarea id="text"  name="text">Hello! I love JavaScript 👍</textarea>
      <button id="stop">Stop!</button>
      <button id="speak">Speak</button>

    </div>

<script>

   let voices = [];
  const voicesDropdown = document.querySelector('#voices');
	
	const rate = document.querySelector("#rate");
const pitch = document.querySelector("#pitch");
  const speakButton = document.querySelector('#speak');
  const stopButton = document.querySelector('#stop');
	let currentText = "";
	     function loadVoices(){

      voices = speechSynthesis.getVoices();


      // Edge case: no voices available
      if(voices.length === 0){

          voicesDropdown.innerHTML =
          '<option>No voices available</option>';

          return;
      }


      voicesDropdown.innerHTML =
      '<option value="">Select A Voice</option>';


      voices.forEach((voice)=>{

          const option = document.createElement("option");

          option.value = voice.name;

          option.textContent =
          `${voice.name} (${voice.lang})`;


          voicesDropdown.appendChild(option);

      });

   }



   // Load voices initially
   loadVoices();


   // Load voices when browser provides them
   speechSynthesis.onvoiceschanged = loadVoices;

  //Your code goes here
	let utterance=null;
	let textarea=document.querySelector('#text');
	
	speakButton.addEventListener('click',()=>{
		 if(textarea.value.trim()===""){
		return;
      }
		 currentText = textarea.value;
		
		 utterance=new SpeechSynthesisUtterance(currentText);
		const selectvoice=voices.find(voice=>voice.name===voicesDropdown.value)
		   utterance.voice=selectvoice;
		utterance.rate = Number(rate.value);
        utterance.pitch = Number(pitch.value);
		speechSynthesis.cancel();
		speechSynthesis.speak(utterance);
   });
	stopButton.addEventListener('click',()=>{
		speechSynthesis.cancel();
		utterance = null;
})
	voicesDropdown.addEventListener("change", () => {

    if (speechSynthesis.speaking) {

        speechSynthesis.cancel();

         utterance = new SpeechSynthesisUtterance(currentText);

        const selectedVoice = voices.find(
            (voice) => voice.name === voicesDropdown.value
        );
 
        utterance.voice = selectedVoice;
		utterance.rate = Number(rate.value);
        utterance.pitch = Number(pitch.value);

        speechSynthesis.speak(utterance);
    }

});
	rate.addEventListener("input",()=>{


       if(utterance){

          utterance.rate = Number(rate.value);

       }

   });





   // Dynamically update pitch
   pitch.addEventListener("input",()=>{


       if(utterance){

          utterance.pitch = Number(pitch.value);

       }

   });
		
</script>

</body>
</html>
